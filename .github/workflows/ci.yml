# CI/CD for the NYC Taxi high-tip MLOps project.
#
# Two jobs:
#   test    : runs the unit-test suite on every push and pull request.
#   retrain : on a weekly schedule (and on demand) regenerates a small
#             sample, runs the full training + MLflow logging + registry
#             promotion path, and uploads the resulting model artifacts.
#             This demonstrates the automated-retraining loop that closes
#             the MLOps cycle.
#
# The retrain job trains on a small synthetic sample (tests/make_sample_data.py)
# rather than the multi-hundred-MB monthly parquet, so it runs in seconds
# and never depends on an external download.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Every Monday at 06:00 UTC -- the "scheduled retrain" trigger.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pyarrow

      - name: Run unit tests
        run: pytest tests/test_features.py -v

  pinned:
    name: Pinned dependencies + API smoke test
    # Installs EXACTLY requirements.txt (the versions the project documents),
    # checks for conflicts, runs the tests, trains on the sample data and
    # calls the real API. This is what proves a dependency bump (for example
    # MLflow) still works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Run unit tests
        run: pytest tests/test_features.py -v

      - name: Train on sample data
        run: |
          python tests/make_sample_data.py
          python training/train_v2.py --sample 0

      - name: Start API and call /health and /predict
        run: |
          python -m uvicorn serving.app_api:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 3
          done
          curl -sf http://127.0.0.1:8000/health || { cat api.log; exit 1; }
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'content-type: application/json' \
            -d '{"trip_distance":3.2,"pickup_datetime":"2026-03-04T18:10:00","dropoff_datetime":"2026-03-04T18:32:00","pu_location_id":161,"do_location_id":237,"passenger_count":1}' \
            | tee predict.json
          python -c "import json; d=json.load(open('predict.json')); assert 0 <= d['high_tip_probability'] <= 1"

  keepalive:
    name: Keep scheduled workflow enabled
    # GitHub disables scheduled workflows after 60 days without repository
    # activity, and a disabled workflow also stops running on push. Re-enabling
    # the workflow on every scheduled run keeps it alive.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ci.yml/enable"

  retrain:
    name: Scheduled retrain
    runs-on: ubuntu-latest
    # Run after tests pass; only on schedule or manual dispatch, not on
    # every push (keeps PR feedback fast).
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost mlflow pyarrow matplotlib

      - name: Generate sample data
        run: python tests/make_sample_data.py

      - name: Train, log to MLflow, and promote champion
        run: python training/train_v2.py --sample 0

      - name: Upload model + tracking store
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model
          path: |
            mlflow.db
            mlruns/
          retention-days: 14
